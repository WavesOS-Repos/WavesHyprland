conky.config = {
--==============================================================================

--  Created : 2022/Jun/05
--  This theme is for conky version 1.10.8 or newer
-- 
--  SARGAS
--  ( A part of Scorpio Conky themes pack )
--
--  author  : Closebox73
--  version : 2.2
--  variant : Playerctl & Fahrenheit
--  license : Distributed under the terms of GPLv3

--==============================================================================

-- Size and Position settings --
  alignment = 'middle_right',
  gap_x = 130,
  gap_y = 110,
  maximum_width = 300,
  minimum_height = 700,
  minimum_width = 440,
  
-- Text settings --
  use_xft = true,
  override_utf8_locale = true,
  font = 'Roboto:size=2',
  
-- Color Settings --
  default_color = 'white',
  default_outline_color = 'black',
  default_shade_color = 'black',
  color1 = '1E90FF',
  
-- Window Settings --
  background = false,
  border_width = 1,
  draw_borders = false,
  draw_graph_borders = false,
  draw_outline = false,
  draw_shades = false,
  own_window = true,
  own_window_colour = '000000',
  own_window_class = 'Conky',
  own_window_argb_visual = true,
  own_window_type = 'desktop',
  own_window_transparent = true,
  own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
  stippled_borders = 0,
  
-- Others --
  cpu_avg_samples = 2,
  net_avg_samples = 2,
  double_buffer = true,
  out_to_console = false,
  out_to_stderr = false,
  extra_newline = false,
  update_interval = 1,
  uppercase = false,
  use_spacer = 'none',
  show_graph_scale = false,
  show_graph_range = false,
  lua_load = '~/.config/conky/Sargas/scripts/rings-v1.2.1.lua',
  lua_draw_hook_pre = 'ring_stats', 
}

conky.text = [[
${execi 300 ~/.config/conky/Sargas/scripts/weather-v2.0.sh}\
${color}${font Bebas Neue:size=55}${time %Y}${font}
${voffset 0}${color}${font Bebas Neue:size=55}${time %^A}${font}
${voffset 0}${color}${font Bebas Neue:size=55}${time %d}${font}
${voffset 0}${font Bebas Neue:size=55}${time %^B}${font}
${voffset 0}${font Bebas Neue:size=55}${time %I:}${color1}${time %M}${font}
${voffset 25}${color}${font Carlito:medium:size=10}Today weather in ${execi 300 cat ~/.cache/weather.json | jq -r '.name'}
${voffset 2}is ${execi 200 cat ~/.cache/weather.json | jq -r '.weather[0].description'} with temperature ${execi 200 cat ~/.cache/weather.json | jq '.main.temp' | awk '{print int($1+0.5)}'} °F
${voffset 2}But, feels like is ${execi 200 cat ~/.cache/weather.json | jq '.main.feels_like' | awk '{print int($1+0.5)}'} °F, and humidity is ${execi 200 cat ~/.cache/weather.json | jq '.main.humidity'}%

${font Carlito:bold:size=11}${exec ~/.config/conky/Sargas/scripts/playerctl.sh}
${voffset 3}${color1}${font Carlito:bold:size=14}~ ${exec playerctl metadata xesam:title}
${voffset 76}${color}${font Bebas Neue:size=14}${offset 19}CPU${goto 103}RAM${goto 182}DISK
]]
