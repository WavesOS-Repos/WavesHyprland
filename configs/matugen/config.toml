[config]
version_check = false

[templates.hyprland]
input_path  = "~/.config/matugen/templates/hyprland-colors.lua"
output_path = "~/.config/hypr/matugen-colors.lua"
post_hook   = "hyprctl reload"

[templates.waybar]
input_path  = "~/.config/matugen/templates/waybar-colors.css"
output_path = "~/.config/waybar/wall-theme.css"
post_hook = "~/.config/hypr/scripts/waybar-reload.sh --reload"

[templates.kitty]
input_path  = "~/.config/matugen/templates/kitty.conf"
output_path = "~/.config/kitty/colors-matugen.conf"
post_hook   = "kill -SIGUSR1 $(pidof kitty) 2>/dev/null || true"

[templates.rofi]
input_path  = "~/.config/matugen/templates/rofi.rasi"
output_path = "~/.config/rofi/colors/colors-rofi.rasi"
